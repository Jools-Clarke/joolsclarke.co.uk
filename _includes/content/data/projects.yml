# Picture tiles in the left-hand column of the homepage, top to bottom.
#
#   url:      page the tile links to (required)
#   image:    logo or picture. A logo is shown whole; if the tile also has a
#             title, the picture fills the tile with the title on top of it.
#   image_dark: optional version of a logo for dark mode
#   alt:      describes the image (needed when there is no title)
#   title / subtitle: text written over the picture
#   text:     one line under a logo (logo tiles only)
#   accent:   optional colour 1-6 for the left border

- url: /perturb/
  image: /perturb/perturb-full-light.svg
  image_dark: /perturb/perturb-full-dark.svg
  alt: Perturb logo
  text: An interpretability framework for black-box retrievals
  accent: 3

- url: /ccc/
  image: /ccc/ClimateChangeCommittee.png
  alt: Climate Change Committee logo
  text: Moving the UK Climate Change Committee's models to Python
  accent: 2

- url: /conferences/
  image: /conferences/conference_preview.png   # a screenshot of /conferences/
  title: Conference Map
  subtitle: See where I have been
  accent: 4

- url: /ariel/gallery/
  image: /ariel/gallery/decode.png
  title: Gallery
  subtitle: Check out some of my more creative work
  accent: 5
