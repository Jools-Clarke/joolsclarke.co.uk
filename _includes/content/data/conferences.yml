# Conferences, meetings and schools, oldest first. Each one gets a pin and a
# list entry on /conferences/, and is listed in /llms.txt.
#
#   title:  name (required)
#   coords: [latitude, longitude] (required). Right-click a spot in Google
#           Maps to copy these.
#   image:  optional photo; put it in conferences/photos/ and run
#           scripts/thumbnails.sh so a small version is made for the page
#   text:   what I did there

