<a href="{{ include.href }}" class="link-box {{ include.accent }} conf-map-box">
  <div class="conf-map-preview">
    <img src="{{ include.image }}" alt="{{ include.alt }}" />
    <div class="conf-map-overlay">
      <h3>{{ include.title }}</h3>
      <p>{{ include.subtitle }}</p>
    </div>
  </div>
</a>
