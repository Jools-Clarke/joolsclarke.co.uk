# Gaussian Perturb: the links and summary used on /perturb/, on every demo
# page (/perturb/demos/…) and in /llms.txt.
#
#   summary:  a few sentences about the package for AI assistants (llms.txt)
#   paper / repo / replication:  cards on /perturb/. A card with no url is
#             greyed out ("coming soon"). repo is also the demos' "Package repo" button.

summary: |
  Perturb is an interpretability framework for understanding the predictions made by machine learning retrievals. It is capable of calculating specific critical datapoints that the retrieval relies on, visualising non-linearities and anomalous model response, and overall providing confidence in model performance. We will be open sourcing all the data and code alongside the official journal publication, so please check back, the repo will be linked below as soon as it is ready!


